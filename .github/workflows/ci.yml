name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            scripts/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm ci --prefix scripts --no-audit --no-fund
      - name: Start deterministic backend and frontend
        shell: bash
        run: |
          (cd backend && DETERMINISTIC_MODE=true uvicorn app.main:app --host 127.0.0.1 --port 8000) > backend.log 2>&1 &
          (cd frontend && npm run dev -- --host 127.0.0.1) > frontend.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:8000/api/health >/dev/null && curl -fsS http://127.0.0.1:5173 >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health >/dev/null
          curl -fsS http://127.0.0.1:5173 >/dev/null
      - name: Run browser workflow
        run: npm run e2e --prefix scripts
